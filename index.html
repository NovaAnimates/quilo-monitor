<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quilo Monitor</title>
    <style>
        :root { --bg: #0f111a; --card: #161b22; --accent: #00f2ff; --text: #e6edf3; --text-dim: #8b949e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: var(--accent); margin-bottom: 30px; letter-spacing: 2px; }
        
        /* Stats Row */
        .stats-container { display: flex; gap: 20px; width: 100%; max-width: 600px; margin-bottom: 20px; }
        .stat-box { background: var(--card); flex: 1; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #30363d; }
        .stat-value { display: block; font-size: 2rem; font-weight: bold; color: var(--accent); margin-top: 10px; }
        .stat-label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; }

        /* Content Sections */
        .section { background: var(--card); width: 100%; max-width: 600px; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #30363d; box-sizing: border-box; }
        .section-title { font-size: 1.1rem; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px; color: var(--accent); }
        #ai-summary { line-height: 1.6; font-style: italic; color: #c9d1d9; }

        /* Exam List */
        .exam-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #21262d; }
        .exam-item:last-child { border-bottom: none; }
        .exam-date { color: #ff7b72; font-weight: bold; }
    </style>
</head>
<body>

    <h1>QUILO MONITOR</h1>

    <div class="stats-container">
        <div class="stat-box">
            <span class="stat-label">Today's Study</span>
            <span id="today-time" class="stat-value">0h 0m</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Weekly Total</span>
            <span id="weekly-time" class="stat-value">0h 0m</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">AI Performance Summary</div>
        <p id="ai-summary">Waiting for update from tablet...</p>
    </div>

    <div class="section">
        <div class="section-title">Upcoming Exams</div>
        <div id="exam-list">
            </div>
    </div>

    <script>
        // REPLACE THIS with your actual Firebase URL
        const DB_URL = "https://your-project-id.firebaseio.com/monitor.json";

        async function updateDashboard() {
            try {
                const response = await fetch(DB_URL);
                const data = await response.json();
                if (!data) return;

                document.getElementById('today-time').innerText = data.today_time || "0h 0m";
                document.getElementById('weekly-time').innerText = data.weekly_time || "0h 0m";
                document.getElementById('ai-summary').innerText = data.ai_summary || "No summary available.";

                const examList = document.getElementById('exam-list');
                examList.innerHTML = ''; 
                
                if (data.exams) {
                    data.exams.forEach(exam => {
                        const item = document.createElement('div');
                        item.className = 'exam-item';
                        item.innerHTML = `<span>${exam.subject}</span><span class="exam-date">${exam.date}</span>`;
                        examList.appendChild(item);
                    });
                }
            } catch (e) { console.error("Update failed", e); }
        }

        setInterval(updateDashboard, 60000); // Update every minute
        updateDashboard();
    </script>
</body>
</html>
